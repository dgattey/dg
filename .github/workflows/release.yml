# Preview target version on PRs and create releases on merge
name: Release

on:
  pull_request:
    types: [opened, edited, synchronize, closed]
    branches: [main]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  bump:
    name: "📦 Bump version"
    # Edits only matter when they retarget the PR or change the release type.
    # The checkbox strings must match parseReleaseType in packages/cli/src/version.ts
    # (contains() is case-insensitive, like its /i regexes).
    if: >-
      github.event.pull_request.state == 'open' && (
        github.event.action != 'edited' ||
        github.event.changes.base ||
        (github.event.changes.body && (
          contains(github.event.changes.body.from, '- [x] Major') != contains(github.event.pull_request.body, '- [x] Major') ||
          contains(github.event.changes.body.from, '- [x] Minor') != contains(github.event.pull_request.body, '- [x] Minor')
        ))
      )
    # Job-level so skipped edit runs don't cancel an in-flight bump or release.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR with tags
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Compute target version
        id: bump
        run: |
          set -euo pipefail
          git fetch --tags --force
          OUTPUT=$(pnpm --filter=@dg/cli --silent version:bump "$GITHUB_EVENT_PATH")
          echo "$OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upsert PR version comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pnpm --filter=@dg/cli --silent version:pr-comment "$GITHUB_EVENT_PATH" "${{ steps.bump.outputs.VERSION_TO }}" will-be

  release:
    name: "🚀 Create release"
    if: github.event.pull_request.merged == true
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Get release info
        id: info
        run: |
          set -euo pipefail
          git fetch --tags --force
          OUTPUT=$(pnpm --filter=@dg/cli --silent version:release-info "$GITHUB_EVENT_PATH")
          echo "$OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        id: release
        uses: actions/github-script@v9.0.0
        env:
          VERSION: ${{ steps.info.outputs.VERSION }}
          NOTES: ${{ steps.info.outputs.NOTES }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = `v${process.env.VERSION}`;
            const body = process.env.NOTES || '';

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.setFailed(`Release ${tag} already exists. Cannot create duplicate release.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const { data: createdRelease } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              body,
              target_commitish: context.payload.pull_request.merge_commit_sha,
            });

            core.info(`Created release ${tag}`);
            core.setOutput('release_url', createdRelease.html_url);
            core.setOutput('published_at', createdRelease.published_at || new Date().toISOString());

      - name: Dual-write release to database and revalidate changelog
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NOTES: ${{ steps.info.outputs.NOTES }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          SITE_URL: ${{ secrets.SITE_URL }}
          VERSION: ${{ steps.info.outputs.VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Skipping release dual-write (SITE_URL or CRON_SECRET not configured)"
            exit 0
          fi
          PAYLOAD=$(node -e 'process.stdout.write(JSON.stringify({
            version: `v${process.env.VERSION}`,
            url: process.env.RELEASE_URL,
            publishedAt: process.env.PUBLISHED_AT,
            body: process.env.NOTES || "",
          }))')
          curl -fsS --max-time 30 -X POST "${SITE_URL%/}/api/releases" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Update PR version comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.info.outputs.VERSION }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          set -euo pipefail
          pnpm --filter=@dg/cli --silent version:pr-comment "$GITHUB_EVENT_PATH" "$VERSION" released
