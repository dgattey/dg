# CI checks: formatting, types, tests
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - command: "check:ci"
            name: "🧹 Check"
          - command: "check:types"
            name: "🔎 Check types"
          - command: "test"
            name: "🧪 Test"

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - run: pnpm install
      - name: Start local PostgreSQL for tests
        if: matrix.command == 'test'
        run: |
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE dg_test;"
      - name: ${{ matrix.command }}
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/dg_test?sslmode=disable
        run: NODE_OPTIONS=--max_old_space_size=8192 pnpm turbo ${{ matrix.command }}
